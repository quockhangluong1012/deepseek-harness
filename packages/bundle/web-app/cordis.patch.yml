# The dsh-web-app bundle patch: the browser surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `dsh --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|ptc|both) opts a whole dsh
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    # Governance plane (spec §33 B0): the kernel and its builtin capability
    # declarations, plus the prompt-injection guard, all mounted in `shadow`.
    # Shadow records what each decision would have been and changes no
    # behaviour, so a deployment measures a permission document against real
    # traffic before any of it can stop a call. The kernel writes log-only
    # task/action/verification records; the guard wraps tool results and model
    # proposals in a tainted envelope and redacts credentials in `enforce`.
    - id: agent-kernel
      name: '@deepseek-ai/dsh-agent-kernel'
      config:
        mode: shadow

    - id: agent-kernel-builtins
      name: '@deepseek-ai/dsh-agent-kernel-builtins'

    - id: prompt-injection
      name: '@deepseek-ai/dsh-prompt-injection'
      config:
        mode: shadow

    # Knowledge plane (S2): record the sources placed with each assembly,
    # without changing the model request until a deployment opts into apply.
    - id: agent-context
      name: '@deepseek-ai/dsh-agent-context'
      config:
        mode: shadow
    # Guard row. `budgets` mounts with every ceiling off: it observes each
    # turn and rejects nothing until a deployment sets a ceiling here.

    - id: budgets
      name: '@deepseek-ai/dsh-budgets'

    # Provider-outage row. Mounted dormant — an empty `fallbackRoutes` is the
    # valid off state, so no failure switches routes until a deployment (or a
    # later patch layer) names the recovery routes to rotate through.
    - id: llm-fallback
      name: '@deepseek-ai/dsh-llm-fallback'

    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # Session-header "Open In..." split button over the host application
    # resolution (macOS/Windows/Linux; a host with no resolved application
    # renders no button). Two halves: the host routes and the browser surface.
    - id: open-in-app
      name: '@deepseek-ai/dsh-host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-open-in-app
      name: '@deepseek-ai/dsh-client-ui-open-in-app'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: workspace-memory
      name: '@deepseek-ai/dsh-workspace-memory'
      config:
        capacityBytes: 131072

    - id: workspace-memory-llm
      name: '@deepseek-ai/dsh-workspace-memory-llm'

    - id: workspace-memory-context
      name: '@deepseek-ai/dsh-workspace-memory-context'
      config:
        maxBytes: 16384

    # Autonomy slice: idle-triggered background maintenance, mounted before
    # the Evolution family below because `evolution-memory`'s own init reads
    # `ctx.get('evolutionHeartbeat')` once and never rechecks it, so the
    # heartbeat must already be provided by the time memory initializes. The
    # heartbeat is a host-wide due-check timer that runs no work of its own;
    # feedback records failing tool results with no model call; dreaming
    # reads feedback's observations and promotes durable narratives into its
    # own `evolution_dreams` domain on the heartbeat's schedule (and via
    # `/dream`), making no model call either; the graph stores per-scope
    # entities and relations for the read-only `/graph` command. Feedback is
    # mounted before its two readers: dreaming's light phase, and the curator
    # pass below, which grades those observations into skill trust.
    - id: evolution-heartbeat
      name: '@deepseek-ai/dsh-evolution-heartbeat'

    - id: evolution-feedback
      name: '@deepseek-ai/dsh-evolution-feedback'

    - id: evolution-dreaming
      name: '@deepseek-ai/dsh-evolution-dreaming'

    - id: evolution-graph
      name: '@deepseek-ai/dsh-evolution-graph'
      config:
        profile: default

    # Semantic memory (§14): the embeddings registry, one OpenRouter provider,
    # and the pre-step search that injects sibling-session briefs. The key
    # resolves from the launching environment per batch (no credentials seam
    # needed); without OPENROUTER_API_KEY the vector channel degrades to no
    # results and turns run unchanged. The 0.7 threshold is calibrated for
    # the primary model below; switching models means recalibrating it.
    - id: embeddings
      name: '@deepseek-ai/dsh-embeddings'

    - id: embeddings-http
      name: '@deepseek-ai/dsh-embeddings-http'
      config:
        baseURL: 'https://openrouter.ai/api/v1'
        model: 'nvidia/llama-nemotron-embed-vl-1b-v2:free'
        fallbackModel: 'nvidia/nemotron-3-embed-1b:free'
        apiKeyEnv: 'OPENROUTER_API_KEY'

    - id: active-memory-context
      name: '@deepseek-ai/dsh-active-memory-context'
      config:
        maxBytes: 16384
        profile: default

    # Evolution family (`specs/evolutionary-harness-v11-deep-research.md` and
    # `docs/subsystems/evolutionary-harness.md`): per-scope memory,
    # the background reviewer, the brief injector, skill telemetry and
    # management, the curator pass, and the governance commands. The reviewer
    # and the injector share one `profile` namespace, so they read and write the
    # same records; telemetry precedes the packages that resolve it.
    - id: evolution-memory
      name: '@deepseek-ai/dsh-evolution-memory'
      config:
        capacityBytes: 131072

    - id: evolution-reviewer
      name: '@deepseek-ai/dsh-evolution-reviewer'
      config:
        profile: default

    - id: evolution-memory-context
      name: '@deepseek-ai/dsh-evolution-memory-context'
      config:
        maxBytes: 16384
        profile: default

    - id: evolution-skill-telemetry
      name: '@deepseek-ai/dsh-evolution-skill-telemetry'

    - id: evolution-skill-manage
      name: '@deepseek-ai/dsh-evolution-skill-manage'

    # The verifier-first ladder (§12): the admission gate every candidate body
    # passes before a commit. Level 0 (schema) and level 1 (invariants) decide
    # in-process; levels 2-4 delegate to mounted seams and abstain when a seam
    # is absent, so a host without a simulator or evaluator still gets the
    # deterministic rungs and never a fabricated pass. Mounted before the
    # curator, whose patch admission runs through it.
    - id: evolution-verifiers
      name: '@deepseek-ai/dsh-evolution-verifiers'

    - id: evolution-curator
      name: '@deepseek-ai/dsh-evolution-curator'

    # Meta-evolution (§26, §51 29–33): the five stores that let the engine learn
    # its own configuration. `evolution-operators` ranks mutation operators per
    # artifact class, `evolution-evaluator-strategy` ranks evaluators per task
    # class, `evolution-budget` prices a batch by candidate class, `evolution-
    # router` ranks routes per task class and role, and `evolution-meta` folds
    # the four recorded choices into one engine configuration, deriving which
    # configuration to run next. Every one is mounted before the optimizer that
    # records into them, and every one is a record rather than a policy: nothing
    # here changes what the engine runs, and each reads empty until the optional
    # optimizer below is enabled. `/operators`, `/evaluator-strategy`,
    # `/budget`, `/router`, and `/meta` read them.
    - id: evolution-operators
      name: '@deepseek-ai/dsh-evolution-operators'

    - id: evolution-evaluator-strategy
      name: '@deepseek-ai/dsh-evolution-evaluator-strategy'

    - id: evolution-budget
      name: '@deepseek-ai/dsh-evolution-budget'

    - id: evolution-router
      name: '@deepseek-ai/dsh-evolution-router'

    - id: evolution-meta
      name: '@deepseek-ai/dsh-evolution-meta'

    # Measurement and offline optimization: `evolution-scorer` turns one
    # recorded corpus scenario into the metric triple the optimizer selects on,
    # and `evolution-optimizer` rewrites a SKILL.md through the mutation route
    # and stages the Pareto winner for `/skills approve`. Both need values no
    # shipped profile can invent — the directory of recorded scenarios, and the
    # agent composition each scoring attempt boots (a profile plus the patch it
    # layers, a source bin, and the repo tsconfig) — so both rows ship off and a
    # profile or `--patch` overlay enables them with its own values; see
    # apps/cli/config/examples/evolution-optimize/cordis.yml. Left off, the
    # `/curator optimize` and `/curator experiments` verbs report the missing
    # optimizer instead of guessing a corpus.
    - id: evolution-scorer
      name: '@deepseek-ai/dsh-evolution-scorer'
      disabled: true

    - id: evolution-optimizer
      name: '@deepseek-ai/dsh-evolution-optimizer'
      disabled: true

    # The metric layer (§55): the north-star metric — capability gain per unit
    # of compute — and the supporting set, read from the stores mounted above
    # and below. It opens no domain and writes nothing: each reading resolves
    # its source stores when `/metrics` runs, so a store left unmounted makes
    # its metrics report the missing record rather than disappear. Mounted
    # before the command plane that reads it.
    - id: evolution-metrics
      name: '@deepseek-ai/dsh-evolution-metrics'

    - id: command-evolution
      name: '@deepseek-ai/dsh-command-evolution'
      config:
        profile: default

    - id: evolution-trajectory
      name: '@deepseek-ai/dsh-evolution-trajectory'

    # The trace bus: projects the committed session log into structured
    # learning traces with ranked failure causes. It writes nothing and reaches
    # no model prompt; the session log stays the authoritative raw trace, and
    # the command plane reads it through `/trace`.
    - id: evolution-trace
      name: '@deepseek-ai/dsh-evolution-trace'

    # The automatic curriculum: measures capability gaps from telemetry and
    # the trace store and stages one grounded training task per gap. It writes
    # only its own proposal domain and reaches no model prompt.
    - id: evolution-curriculum
      name: '@deepseek-ai/dsh-evolution-curriculum'

    # The benchmark store: admits curriculum proposals as evaluation tasks
    # with deduplication and contamination states. It writes only its own task
    # domain and reaches no model prompt.
    - id: evolution-benchmark
      name: '@deepseek-ai/dsh-evolution-benchmark'

    # Evaluator ensemble health: the scorer records every behavior-evaluation
    # verdict here, and the command plane reports agreement, drift, and false
    # positives through /evaluators. It writes only its own verdict domain.
    - id: evolution-evaluator-health
      name: '@deepseek-ai/dsh-evolution-evaluator-health'

    # Retrieval-aware evolution (§39): the store that judges a retrieval
    # configuration by the downstream task success of the sessions that ran
    # under it, never by retrieval precision alone. The producer is the
    # active-memory hook above, which records the configuration in force; the
    # store writes only its own domain and reaches no model prompt.
    - id: evolution-retrieval
      name: '@deepseek-ai/dsh-evolution-retrieval'

    # Population-based evolution: the optimizer records every staged write as a
    # candidate here, and the command plane inspects generations, lineages, and
    # the approved elite through /population. It writes only its own candidate
    # domain and reaches no model prompt.
    - id: evolution-population
      name: '@deepseek-ai/dsh-evolution-population'

    # Adaptive model routing: the optimizer records each candidate-generation
    # route and outcome here, and the command plane lists, pins, and recommends
    # routes per evolutionary role through /routes. It writes only its own
    # route domains and reaches no model prompt.
    - id: evolution-model-routes
      name: '@deepseek-ai/dsh-evolution-model-routes'

    # Shadow/canary deployment: the optimizer records every staged write as a
    # shadow deployment here, and the command plane tracks rollouts through
    # /canary. It writes only its own deployment domain and reaches no model
    # prompt; records nothing user-visible.
    - id: evolution-canary
      name: '@deepseek-ai/dsh-evolution-canary'

    # Novelty search: the optimizer records the winner's behavior descriptor
    # here, and the command plane reads archive novelty and its pressure
    # through /novelty. It writes only its own archive domain and reaches no
    # model prompt.
    - id: evolution-novelty-search
      name: '@deepseek-ai/dsh-evolution-novelty-search'

    # Stagnation detection: the optimizer records each staged write as an
    # evaluation run here, and the command plane reads the stagnant flag and
    # the recommended strategy through /stagnation. It writes only its own run
    # domain and reaches no model prompt.
    - id: evolution-stagnation
      name: '@deepseek-ai/dsh-evolution-stagnation'

    # Island evolution: the optimizer advances generation ticks on the skill's
    # head island here, and the command plane registers lanes, records
    # migrations, and reads the migration schedule through /islands. It writes
    # only its own island domains and reaches no model prompt.
    - id: evolution-islands
      name: '@deepseek-ai/dsh-evolution-islands'

    # Controlled self-model: the optimizer records each staged winner as one
    # capability observation here, and the command plane reads the weakest-first
    # capability frontier and the next-to-learn gap through /selfmodel. It
    # writes only its own capability domains and reaches no model prompt.
    - id: evolution-self-model
      name: '@deepseek-ai/dsh-evolution-self-model'

    # Uncertainty-driven learning: the scorer records evaluator disagreement
    # signals here, and the command plane reads the prioritized evaluation
    # queue through /uncertainty. It writes only its own signal domain and
    # reaches no model prompt.
    - id: evolution-uncertainty
      name: '@deepseek-ai/dsh-evolution-uncertainty'

    # Adversarial evolution: the command plane records adversarial probes,
    # reads the next probing challenge, and tracks the evaluator-gaming
    # defense checklist through /adversary. It writes only its own probe
    # domains and reaches no model prompt.
    - id: evolution-adversary
      name: '@deepseek-ai/dsh-evolution-adversary'

    # Dependency-aware lineage: the optimizer records each staged write as a
    # dependency-versioned experiment envelope here, and the command plane
    # compares and replays envelopes through /lineage. It writes only its own
    # envelope domain and reaches no model prompt.
    - id: evolution-lineage
      name: '@deepseek-ai/dsh-evolution-lineage'
      config: {}

    # Sleep-time compute: the command plane anticipates likely future tasks,
    # records precomputed reasoning artifacts, and reads the offline-cost plan
    # through /sleeptime. It writes only its own task and artifact domains and
    # reaches no model prompt.
    - id: evolution-sleeptime
      name: '@deepseek-ai/dsh-evolution-sleeptime'

    # Actuation: the loops that act on what the stores above recorded —
    # ending a live rollout on its measured evidence, migrating an island whose
    # schedule is due, following a stagnant skill's ladder rung, draining the
    # uncertainty queue into benchmark tasks, admitting open curriculum
    # proposals and freshly generated adversarial probes as benchmark tasks,
    # and growing the benchmark from recorded failures. This is the first
    # evolution row that changes what the engine runs rather than recording
    # what it did, so it is mounted last, after every store it reads. Each task
    # writes only to those stores, on the heartbeat's cadence and idle gate,
    # under the class's recorded budget allocation, and reaches no model
    # prompt; nothing here gates a skill's visibility to a model.
    - id: evolution-actuator
      name: '@deepseek-ai/dsh-evolution-actuator'

    # Scope verbs and the journey read model over Typert Remote: the page's
    # data source. Its `profile` namespaces the scope key, and it shares the
    # `default` namespace with the reviewer and the brief injector above.
    - id: evolution-controller
      name: '@deepseek-ai/dsh-evolution-controller'
      config:
        profile: default

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # One background job's observation record streamed over Typert Remote;
    # the roster rides the session control stream above.
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: ui-settings-account
      name: '@deepseek-ai/dsh-client-ui-settings-account'

    - id: account-controller
      name: '@deepseek-ai/dsh-api-account-controller'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    # Credential sign-in flows over Typert Remote for browser surfaces. The
    # seam row offers no flows of its own; llm-pi-ai registers one per
    # installed provider that ships a login, and the remote row serves the
    # Models page sign-in companion.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: authorization-remote
      name: '@deepseek-ai/dsh-authorization-remote'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-cordis`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of dsh-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full Loader tree settles and the required-
    # entry audit passes. The
    # webStartup provider supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@deepseek-ai/dsh-office-to-pdf'

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@deepseek-ai/dsh-client-ui-sidebar-documentpreview'

    # Web profiles opt in; Desktop retains sandboxed HTTP(S) Browser tabs.
    - id: ui-sidebar-browser
      name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"

    - id: ui-sidebar-terminal
      name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    # The right Sidebar's progress tab type: the todo checklist and the produced
    # files, revealed at a Session's first progress.
    - id: ui-progress
      name: '@deepseek-ai/dsh-client-ui-progress'

    # Durable usage ledger behind the dashboard tab: billed attempts
    # aggregated by day and model, served to the tab over the
    # `usageDashboard` Remote namespace below.
    - id: usage-ledger
      name: '@deepseek-ai/dsh-usage-ledger'
      config:
        retentionDays: 90
        writeEveryEvents: 100
        writeIntervalMs: 60000

    # The right Sidebar's usage dashboard tab type plus its Host Remote
    # face over the ledger.
    - id: ui-usage-dashboard
      name: '@deepseek-ai/dsh-client-ui-usage-dashboard'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

