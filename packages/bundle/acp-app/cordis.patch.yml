# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    # Governance plane (spec §33 B0), mirroring the web surface: the kernel
    # and its builtin capability declarations, plus the prompt-injection
    # guard, all mounted in `shadow`. Shadow records what each decision would
    # have been and changes no behaviour.
    - id: agent-kernel
      name: '@deepseek-ai/dsh-agent-kernel'
      config:
        mode: shadow

    - id: agent-kernel-builtins
      name: '@deepseek-ai/dsh-agent-kernel-builtins'

    - id: prompt-injection
      name: '@deepseek-ai/dsh-prompt-injection'
      config:
        mode: shadow

    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

- id: hmr
  disabled: true
