# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header pinned with one would be unreplayable on the other. Replay pins
# the posix pair on every host; a scenario that must run a shell is declared
# `platform: posix` and skipped where no posix shell exists.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/dsh-escalated.txt && cat /tmp/dsh-escalated.txt && rm /tmp/dsh-escalated.txt"
        recordedPath: /tmp/dsh-escalated.txt
        livePath: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT + '/dsh-escalated.txt'
