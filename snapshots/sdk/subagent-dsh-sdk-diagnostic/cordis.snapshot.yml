# Keyless parent-model overlay for the DSH SDK diagnostic snapshot.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header recorded with one would be unreplayable on the other. Replay pins
# the posix pair on every host.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
