# Replay layer for the TypeScript SDK minimal customization patch.

# This composition registers `bash` through `persistent-bash` alone (both
# base shell rows stay disabled), so replay must not re-enable `tool-bash`.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
