# Exercise the model-facing LSP tool through the shipped Loader entry path.
# The scenario workspace supplies the deterministic stdio server used by this test composition.
- id: lsp-stdio
  config:
    autoDetect: false
    servers:
      fixture:
        command: !!js process.execPath
        args: ['./lsp-server.mjs']
        extensionToLanguage:
          '.ts': typescript

- id: tool-lsp
  config:
    maxLocations: 1

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
