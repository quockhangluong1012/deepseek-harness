# Replay the authored turn against the real LSP and post-edit plugins.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    dshHome: './.dsh-home'
    agentsHome: './.agents-home'
    claudeHome: './.claude-home'

- id: lsp-stdio
  config:
    autoDetect: false
    servers:
      fixture:
        command: !!js process.execPath
        args: ['./lsp-server.mjs']
        extensionToLanguage:
          '.ts': typescript
        diagnosticsWaitMs: 1000

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: lsp-mock
            name: LSP fixture
            models:
              - id: lsp-mock
