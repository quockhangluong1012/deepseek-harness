# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.
# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header pinned with one would be unreplayable on the other. Replay pins
# the posix pair on every host; a scenario that must run a shell is declared
# `platform: posix` and skipped where no posix shell exists.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: acp-diagnostic-release-on-job-output
      name: './release-on-job-output.mjs'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: subagent-acp-diagnostic
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js 'process.env.DSH_SNAPSHOT_FILE.replaceAll("\\", "/").split("/").slice(0, -4).join("/") + "/packages/subagent/subagent-acp/tests/mock-acp-server.ts"'
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
          MOCK_PROMPT_HOLD: .dsh/acp-diagnostic-prompt-hold
    - id: tool-subagent-acp-diagnostic
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        backgroundMode: one-shot
        maxDepth: provider-managed
