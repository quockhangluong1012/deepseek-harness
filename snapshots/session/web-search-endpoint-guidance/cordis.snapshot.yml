# Keyless replay counterpart: the failed search remains real; only the
# conversation model adapter is replaced by replay.
# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header pinned with one would be unreplayable on the other. Replay pins
# the posix pair on every host; a scenario that must run a shell is declared
# `platform: posix` and skipped where no posix shell exists.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: web-search-error-fixture
      name: './web-search-error-fixture.mjs'

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKey: snapshot-key
    # The fixture maps this recorded authority to its OS-assigned listener.
    baseURL: http://127.0.0.1:43118/anthropic/v1
