# Keyless replay counterpart of system-prompt-in-history/cordis.yml: the
# replay route declares the same in-history capability.
# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header pinned with one would be unreplayable on the other. Replay pins
# the posix pair on every host; a scenario that must run a shell is declared
# `platform: posix` and skipped where no posix shell exists.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                systemPromptUpdate: in-history
                inputModalities: [text, image]
    - id: in-history-prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/in-history-prompt-update.ts'
