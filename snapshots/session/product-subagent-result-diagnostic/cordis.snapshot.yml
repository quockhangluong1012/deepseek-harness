# Keyless twin of subagent-result-diagnostic.cordis.yml: keep the same test
# provider/tool and replace only the external model adapter.
# The shipped base composition swaps `tool-bash` and `tool-pwsh` by platform,
# so a header pinned with one would be unreplayable on the other. Replay pins
# the posix pair on every host; a scenario that must run a shell is declared
# `platform: posix` and skipped where no posix shell exists.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: subagent-result-diagnostic
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-result-diagnostic.ts'
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: snapshot-diagnostic
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
