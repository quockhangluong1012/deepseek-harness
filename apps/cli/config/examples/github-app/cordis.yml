# Opt-in GitHub app overlay over the shipped Web composition: the shipped
# pull-request and issue rules answer signed deliveries, and the second
# WebServer lives in an isolated realm so exposing webhook ingress never
# exposes the UI API. GitHub must subscribe to the Pull requests and Issues
# events with content type application/json.

- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: github-app-rules
      name: '@deepseek-ai/dsh-webhook-github/app'
      config:
        source: primary-github
        repository: deepseek-ai/deepseek-harness
        workspacePath: !!js process.env.DSH_GITHUB_APP_WORKSPACE ?? process.cwd()
        agentPreset: standard
        permissionPreset: read-only

    - id: github-app-ingress
      name: cordis:group
      group: true
      isolate:
        webServer: true
      config:
        - id: github-app-server
          name: '@deepseek-ai/dsh-host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js Number(process.env.DSH_GITHUB_APP_PORT ?? 3081)

        - id: github-app-adapter
          name: '@deepseek-ai/dsh-webhook-github'
          config:
            source: primary-github
            path: /github
            secretEnv: DSH_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
